:root{--SP0:0px;--SP1:4px;--SP2:8px;--SP3:12px;--SP4:16px;--SP5:20px;--SP6:24px;--SP7:32px;--SP8:40px;--SP9:60px;--SP10:80px;--RD0:0px;--RD1:4px;--RD2:8px;--RD3:12px;--RD4:16px;--RD5:20px;--RD6:24px;--RD7:32px;--RD8:40px;--RD9:999px;--RD10:6px;
--CT1:#0F0F1B;--CT4:#87878D;--CB1:#FFFFFF;--CB2:#F2F4F8;--CP0:#F93838;
--font-sans:-apple-system,"PingFang SC",system-ui,"Noto Sans SC",sans-serif;--font-num:"GJTypeDisplay",var(--font-sans)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:750px;margin:0 auto;background:var(--CB2);color:var(--CT1);font-family:var(--font-sans);padding-bottom:var(--SP9)}
.demo{font-size:24px;line-height:36px;color:var(--CT4);padding:var(--SP7) var(--SP6) var(--SP3)}.demo b{color:var(--CT1);font-weight:500}
/* ===== 进度条 ===== */
.pg{height:60px;background:var(--CB1);padding:0 var(--SP6);display:flex;align-items:center}
.pg .tk{position:relative;flex:1;height:32px}
.pg .tk::before{content:"";position:absolute;left:0;right:0;top:10px;height:12px;border-radius:var(--RD9);background:var(--CB2)}
.pg .fl{position:absolute;left:0;top:0;height:32px;width:calc(68px + (100% - 68px) * var(--p))}
.pg .fl::before{content:"";position:absolute;left:0;right:0;top:10px;height:12px;border-radius:var(--RD9);background:var(--CP0)}
.pg.p0 .fl::before{display:none}
.pg.nov .pill{display:none}.pg.nov .fl{width:calc(100% * var(--p))}.pg.nov.p0 .fl::before{display:none}
.pg .pill{position:absolute;right:0;top:0;width:68px;height:32px;border-radius:var(--RD9);background:var(--CB1);box-shadow:inset 0 0 0 2px var(--CP0);color:var(--CP0);font:500 20px/32px var(--font-num);text-align:center;font-variant-numeric:tabular-nums}
.gap{height:var(--SP2)}
.ctl{background:var(--CB1);padding:var(--SP4) var(--SP6);font-size:24px;line-height:36px;color:var(--CT4);display:flex;gap:var(--SP4);align-items:center}.ctl input{flex:1}
</style>
</head>
<body>
<div class="demo"><b>百分比进度条</b> · 750×60 白底,左右 24;轨道 12;进度值 68×32,右缘贴在填充末端</div>
<div class="demo" style="padding-top:var(--SP4)">起点 0%:只显示进度值,贴轨道左端,没有红色填充</div><div class="pg p0" style="--p:0.0"><div class="tk"><div class="fl"><span class="pill">0%</span></div></div></div>
<div class="demo" style="padding-top:var(--SP4)">小进度:填充至少 68 宽,进度值不越出左端</div><div class="pg" style="--p:0.03"><div class="tk"><div class="fl"><span class="pill">3%</span></div></div></div>
<div class="demo" style="padding-top:var(--SP4)">中间:进度值跟着填充末端走</div><div class="pg" style="--p:0.56"><div class="tk"><div class="fl"><span class="pill">56%</span></div></div></div>
<div class="demo" style="padding-top:var(--SP4)">终点 100%:进度值贴轨道右端,不溢出</div><div class="pg" style="--p:1.0"><div class="tk"><div class="fl"><span class="pill">100%</span></div></div></div>
<div class="demo"><b>隐藏进度值</b> · 开关「进度值」关闭后只剩轨道 + 填充,填充宽 = 进度 × 轨道宽</div><div class="pg nov" style="--p:.56"><div class="tk"><div class="fl"><span class="pill">56%</span></div></div></div>
<div class="demo"><b>连续进度</b> · 拖动查看(演示用,组件本身不可拖)</div><div id="live"><div class="pg" style="--p:0.37"><div class="tk"><div class="fl"><span class="pill">37%</span></div></div></div></div><div class="ctl">0<input type="range" min="0" max="100" value="37" id="r">100<label><input type="checkbox" id="sv" checked> 进度值</label></div>
<script>const r=document.getElementById('r'),l=document.querySelector('#live .pg');r.oninput=()=>{l.style.setProperty('--p',r.value/100);l.classList.toggle('p0',r.value==0);l.querySelector('.pill').textContent=r.value+'%'};document.getElementById('sv').onchange=e=>l.classList.toggle('nov',!e.target.checked);</script>
</body>
