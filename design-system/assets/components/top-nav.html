.gj-statusbar{display:flex;justify-content:space-between;align-items:center;height:88px;padding:var(--SP0) 46px;color:var(--CT1)}
.gj-sb-time{font-size:30px;font-weight:600;letter-spacing:1px}
.gj-sb-right{display:inline-flex;align-items:center}
.gj-sb-icons{display:block;width:134px;height:23px}

/* ===== 顶部导航栏 top-nav(规则集:按场景取档;整体高176=状态栏88+操作栏88)===== */
.gj-tnav{width:100%;background:var(--CB1,#fff);box-sizing:border-box}
/* 操作栏:88 高、width100% 自适应、两端对齐(左组靠左/右组靠右/中间留白)、左右安全区24、元素间距32 */
.gj-tnav-bar{position:relative;display:flex;align-items:center;justify-content:space-between;height:88px;padding:var(--SP5) var(--SP6);box-sizing:border-box}
.gj-tnav-left{display:flex;align-items:flex-end;gap:var(--SP6);min-width:0}
.gj-tnav-right{display:flex;align-items:center;gap:var(--SP7);flex-shrink:0}
.gj-tnav-right .iconfont,.gj-tnav-left .iconfont{font-size:48px;line-height:1;color:var(--CT1,#0F0F1B)}
/* 小宝(非标容器 72×76 渐变球,走 SVG) */
.gj-tnav-bao{width:72px;height:76px;flex-shrink:0;display:block}
.gj-tnav-bao svg{width:72px;height:76px;display:block}
/* 导航栏频道 tab:选中44 Medium / 未选36 Regular(独立字号体系,非内容区 tab) */
.gj-tnav-tabs{display:flex;align-items:flex-end;gap:var(--SP7)}
.gj-tnav-tab{cursor:pointer;white-space:nowrap;color:var(--CT1,#0F0F1B);font-size:36px;font-weight:400;line-height:54px;padding:var(--SP1) var(--SP0);user-select:none}
.gj-tnav-tab.is-on{color:var(--CT1,#0F0F1B);font-size:44px;font-weight:500;line-height:66px;padding:var(--SP0)}
/* 二级:标题绝对居中 */
.gj-tnav-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:flex-end;gap:var(--SP9)}
.gj-tnav-title{font-size:36px;font-weight:500;color:var(--CT1,#0F0F1B);white-space:nowrap;line-height:1.05}
.gj-tnav-title2{font-size:32px;font-weight:400;color:var(--CT3,#55555E);line-height:1.05}
/* 二级:右侧操作文字 32/48 Regular CT1(文字操作开关可关、文案可改,默认「其他」);分享图标受图标操作开关控制 */
.gj-tnav-op{font-size:32px;line-height:48px;font-weight:400;color:var(--CT1,#0F0F1B);white-space:nowrap}
