<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=750">
<meta name="gj-bom" content="C05 开关; Figma Switch 开关页 开关 4034:57727">
<title>C05 开关 · 参考实现</title>
<style>
:root{--SP0:0px;--SP1:4px;--SP2:8px;--SP3:12px;--SP4:16px;--SP5:20px;--SP6:24px;--SP7:32px;--SP8:40px;--SP9:60px;--SP10:80px;--RD0:0px;--RD1:4px;--RD2:8px;--RD3:12px;--RD4:16px;--RD5:20px;--RD6:24px;--RD7:32px;--RD8:40px;--RD9:999px;--RD10:6px;
--CT1:#0F0F1B;--CT3:#55555E;--CT4:#87878D;--CB1:#FFFFFF;--CB2:#F2F4F8;--CB53:#E2E8F2;--CP0:#F93838;--CI5:#FFFFFF;
--font-sans:-apple-system,"PingFang SC",system-ui,"Noto Sans SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{width:750px;margin:0 auto;background:var(--CB2);color:var(--CT1);font-family:var(--font-sans);padding-bottom:var(--SP9)}
.demo{font-size:24px;line-height:36px;color:var(--CT4);padding:var(--SP7) var(--SP6) var(--SP3)}.demo b{color:var(--CT1);font-weight:500}
.blk{background:var(--CB1);padding:var(--SP6) var(--SP4);display:grid;grid-template-columns:48px repeat(4,max-content);gap:var(--SP5) var(--SP5);align-items:center}
.blk .h{font-size:20px;line-height:30px;color:var(--CT4)}
/* ===== 开关 ===== */
.sw{display:inline-flex;align-items:center;gap:var(--SP3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw .tx{font-size:28px;line-height:44px;color:var(--CT3)}
.sw .tr{position:relative;width:80px;height:48px;border-radius:var(--RD9);background:var(--CB53);transition:background .2s}
.sw .kn{position:absolute;top:var(--SP1);left:var(--SP1);width:40px;height:40px;border-radius:50%;background:var(--CI5);box-shadow:0 0 4.5px 0 rgba(135,135,141,.1);transition:left .2s,box-shadow .2s}
.sw.on .tr{background:var(--CP0)}.sw.on .kn{left:36px;box-shadow:0 0 4.5px 0 rgba(173,21,31,.3)}
.sw.s .tx{font-size:24px;line-height:36px}
.sw.s .tr{width:60px;height:36px}.sw.s .kn{top:3px;left:3px;width:30px;height:30px}.sw.s.on .kn{left:27px}
.sw.dis{cursor:not-allowed}.sw.dis .tr{opacity:.5}.sw.dis .tx{color:var(--CT4)}
</style>
</head>
<body>
<div class="demo"><b>开关</b> · M 80×48 / S 60×36 · 开 / 关 × 默认 / 禁用</div>
<div class="blk"><span></span><span class="h">开</span><span class="h">关</span><span class="h">开·禁用</span><span class="h">关·禁用</span><span class="h">M</span><span class="sw on" role="switch" aria-checked="true"><span class="tr"><span class="kn"></span></span></span><span class="sw" role="switch" aria-checked="false"><span class="tr"><span class="kn"></span></span></span><span class="sw on dis" role="switch" aria-checked="true" aria-disabled="true"><span class="tr"><span class="kn"></span></span></span><span class="sw dis" role="switch" aria-checked="false" aria-disabled="true"><span class="tr"><span class="kn"></span></span></span><span class="h">S</span><span class="sw on s" role="switch" aria-checked="true"><span class="tr"><span class="kn"></span></span></span><span class="sw s" role="switch" aria-checked="false"><span class="tr"><span class="kn"></span></span></span><span class="sw on s dis" role="switch" aria-checked="true" aria-disabled="true"><span class="tr"><span class="kn"></span></span></span><span class="sw s dis" role="switch" aria-checked="false" aria-disabled="true"><span class="tr"><span class="kn"></span></span></span></div>
<div class="demo"><b>开关(带文案)</b> · M 80×48 / S 60×36 · 开 / 关 × 默认 / 禁用 · 文案在左,间距 12</div>
<div class="blk"><span></span><span class="h">开</span><span class="h">关</span><span class="h">开·禁用</span><span class="h">关·禁用</span><span class="h">M</span><span class="sw on" role="switch" aria-checked="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw" role="switch" aria-checked="false"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw on dis" role="switch" aria-checked="true" aria-disabled="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw dis" role="switch" aria-checked="false" aria-disabled="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="h">S</span><span class="sw on s" role="switch" aria-checked="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw s" role="switch" aria-checked="false"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw on s dis" role="switch" aria-checked="true" aria-disabled="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span><span class="sw s dis" role="switch" aria-checked="false" aria-disabled="true"><span class="tx">文案</span><span class="tr"><span class="kn"></span></span></span></div>
<script>document.querySelectorAll('.sw').forEach(e=>e.addEventListener('click',()=>{if(e.classList.contains('dis'))return;e.classList.toggle('on');e.setAttribute('aria-checked',e.classList.contains('on'))}));</script>
</body>
</html>
